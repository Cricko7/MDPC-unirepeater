name: Server image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check scripts and calculate radio budget
        run: |
          find assets monitor server/admin -name '*.js' -print0 | xargs -0 -n 1 node --check
          python tools/mdpc-link-budget.py
          bash -n deploy/deploy.sh
          docker compose config --quiet
      - name: Build and test the container
        run: |
          docker build --build-arg REVISION="$GITHUB_SHA" -t datark:local .
          python server/smoke.py --docker
      - name: Upload the tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker save datark:local | gzip -1 > image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: datark-image
          path: image.tar.gz
          retention-days: 2

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: datark-image
      - name: Publish the verified image to GHCR
        id: push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gunzip -c image.tar.gz | docker load
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-$GITHUB_SHA"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag datark:local "$image"
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    if: vars.DATARK_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: datark-production
    steps:
      - name: Deploy on the Linux server
        id: rollout
        env:
          DEPLOY_HOST: ${{ vars.DATARK_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DATARK_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DATARK_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DATARK_DEPLOY_KNOWN_HOSTS }}
          IMAGE: ${{ needs.publish.outputs.image }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "Skipping deployment because main has moved."
            exit 0
          fi
          umask 077
          : "${DEPLOY_HOST:?}" "${DEPLOY_USER:?}" "${DEPLOY_KEY:?}" "${DEPLOY_KNOWN_HOSTS:?}"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/datark-key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/datark-known-hosts"
          ssh -i "$RUNNER_TEMP/datark-key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/datark-known-hosts" \
            -l "$DEPLOY_USER" -- "$DEPLOY_HOST" /opt/datark/deploy/deploy.sh "$IMAGE"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      - name: Verify the deployed API over HTTPS
        if: steps.rollout.outputs.deployed == 'true'
        env:
          DEPLOY_HOST: ${{ vars.DATARK_DEPLOY_HOST }}
          SWAGGER_TOKEN: ${{ secrets.DATARK_SWAGGER_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          from http.client import HTTPSConnection

          host = os.environ["DEPLOY_HOST"]
          token = os.environ["SWAGGER_TOKEN"]
          if not token:
              raise SystemExit("Set the production secret DATARK_SWAGGER_TOKEN.")

          def get(path, expected, headers=None):
              connection = HTTPSConnection(host, timeout=15)
              try:
                  connection.request("GET", path, headers=headers or {})
                  response = connection.getresponse()
                  if response.status != expected:
                      raise SystemExit(f"GET {path}: expected {expected}, got {response.status}")
                  return response.read()
              finally:
                  connection.close()

          health = json.loads(get("/healthz", 200))
          if health.get("status") != "ok" or health.get("revision") != os.environ["GITHUB_SHA"]:
              raise SystemExit("GET /healthz did not report ok for the deployed commit.")
          print(f"GET /healthz: ok, revision {health['revision']}")

          get("/admin/api/", 401)
          print("GET /admin/api/ without credentials: 401")
          headers = {"Authorization": f"Bearer {token}"}
          if b'id="swagger-ui"' not in get("/admin/api/", 200, headers):
              raise SystemExit("The authenticated page does not contain Swagger UI.")
          spec = json.loads(get("/admin/api/openapi.json", 200, headers))
          if not spec.get("openapi") or "/healthz" not in spec.get("paths", {}):
              raise SystemExit("Swagger returned an invalid API description.")
          if "get" not in spec["paths"].get("/api/sms-test-results", {}):
              raise SystemExit("Swagger does not document the SMS results endpoint.")
          sms = json.loads(get("/api/sms-test-results", 200))
          if sms.get("source") != "synthetic" or {row["lte_mode"] for row in sms["results"]} != {"off", "on"}:
              raise SystemExit("SMS results do not contain both synthetic LTE modes.")
          print("GET /api/sms-test-results: 200, LTE off and on")
          if "get" not in spec["paths"].get("/api/telemetry", {}):
              raise RuntimeError("Swagger does not list GET /api/telemetry")
          if "put" not in spec["paths"].get("/admin/telemetry", {}):
              raise RuntimeError("Swagger does not list PUT /admin/telemetry")
          telemetry = json.loads(get("/api/telemetry?scenario=normal", 200))
          if telemetry.get("source") != "synthetic" or len(telemetry.get("zones", [])) != 5:
              raise RuntimeError("Unexpected telemetry response")
          print("GET /api/telemetry: 200, synthetic readings for five zones")
          if b"SwaggerUIBundle" not in get("/admin/api/vendor/swagger-ui-bundle.js", 200, headers):
              raise SystemExit("The Swagger UI bundle is missing or invalid.")
          print("Swagger UI, OpenAPI JSON and JavaScript bundle: 200 after login")
          PY
