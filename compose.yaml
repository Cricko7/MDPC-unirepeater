services:
  web:
    image: ${DATARK_IMAGE:-datark:local}
    ports:
      - "127.0.0.1:${DATARK_PORT:-8080}:8080"
    environment:
      DATARK_ADMIN_USER: ${DATARK_ADMIN_USER:-admin}
    volumes:
      - settings:/data
    secrets:
      - source: admin-password
        target: /run/datark/admin-password
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

volumes:
  settings:

secrets:
  admin-password:
    file: ${DATARK_ADMIN_PASSWORD_FILE:-./deploy/admin-password}
